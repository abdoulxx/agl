function ScoreBadge({ score }) {
  const cls = score >= 80 ? 'score-high' : score >= 60 ? 'score-med' : 'score-low';
  return <span className={`score-badge ${cls}`}>{score}<span style={{fontSize:'10px',fontWeight:500}}>/100</span></span>;
}

function CircleScore({ score }) {
  const r = 42, circ = 2 * Math.PI * r;
  const fill = (score / 100) * circ;
  const color = score >= 80 ? '#1a7a42' : score >= 60 ? '#a06010' : '#b03030';
  return (
    <svg width="110" height="110" viewBox="0 0 110 110">
      <circle cx="55" cy="55" r={r} fill="none" stroke="#DCDCDC" strokeWidth="8" />
      <circle cx="55" cy="55" r={r} fill="none" stroke={color} strokeWidth="8"
        strokeDasharray={`${fill} ${circ}`} strokeLinecap="round"
        transform="rotate(-90 55 55)" style={{transition:'stroke-dasharray 1s ease'}} />
      <text x="55" y="52" textAnchor="middle" className="progress-ring-text" style={{fill:'var(--c-navy)'}}>{score}</text>
      <text x="55" y="66" textAnchor="middle" className="progress-ring-sub">/100</text>
    </svg>
  );
}

function Sparkline({ data, color = '#143C64', height = 36 }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.offsetWidth || 120; canvas.width = w; canvas.height = height;
    const max = Math.max(...data), min = Math.min(...data);
    const range = max - min || 1;
    const pts = data.map((v, i) => ({ x: (i / (data.length - 1)) * w, y: height - ((v - min) / range) * (height - 6) - 3 }));
    ctx.beginPath();
    pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    // Fill
    ctx.lineTo(pts[pts.length-1].x, height); ctx.lineTo(pts[0].x, height); ctx.closePath();
    ctx.fillStyle = color + '22'; ctx.fill();
  }, []);
  return <canvas ref={canvasRef} style={{width:'100%', height, display:'block'}}></canvas>;
}

          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.y} candidat${ctx.parsed.y > 1 ? 's' : ''}`, title: ctx => `Score ${ctx[0].label}` } }
          },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#787878' }, border: { display: false } },
            y: { grid: { color: '#F0F0C8' }, ticks: { stepSize: 3, font: { size: 11 }, color: '#787878' }, border: { display: false }, beginAtZero: true }
          },
          animation: { duration: 1000, easing: 'easeOutBounce' }
        }
      });
    }, 80);
    return () => clearTimeout(timer);
  }, []);
  return <canvas ref={canvasRef} style={{width:'100%', height:'100%'}}></canvas>;
}

      if (idx >= STEPS.length) {
        // Reveal result fields one by one
        const profile = PROFILES[s];
        profile.fields.forEach((_, i) => {
          setTimeout(() => setRevealedFields(prev => [...prev, i]), i * 180);
        });
        setTimeout(() => {
          setPhase('done');
          if (onCandidateImported) onCandidateImported({
            ...profile, id: Date.now(), responded: false,
            received: new Date().toISOString().slice(0,10),

      const tick = setInterval(() => {
        const pct = Math.min(100, ((Date.now() - start) / dur) * 100);

        if (pct >= 100) { clearInterval(tick); setTimeout(() => runStep(idx + 1), 120); }
      }, 30);
    };
    runStep(0);
  };

              🚀 Lancer l'analyse IA
            </button>
          </div>
        )}
      </div>

      {/* Étape 3 — Pipeline + résultat */}
      {(phase === 'analyzing' || phase === 'done') && profile && (
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}} className="fade-in">

              }
            </div>

            {/* Ripple pulse when active */}
            {phase === 'analyzing' && (
              <div style={{position:'relative',height:60,marginBottom:16,display:'flex',alignItems:'center',justifyContent:'center'}}>
                {[0,1,2].map(i => (
                  <div key={i} style={{position:'absolute',width:40,height:40,borderRadius:'50%',background:'var(--c-gold)',animation:`ripple 2s ${i*0.6}s infinite ease-out`,opacity:0.4}}></div>

              </div>
            )}
            {phase === 'done' && (
              <div style={{textAlign:'center',marginBottom:16,padding:'10px 0'}}>
                <div style={{fontSize:36}}>✅</div>
                <div style={{color:'#7ef5a8',fontWeight:700,fontSize:13,marginTop:4}}>Analyse complète</div>
              </div>
            )}

            {/* Steps */}
            <div style={{display:'flex',flexDirection:'column',gap:0}}>
              {STEPS.map((s,i) => {
                const isDone = i < step || phase === 'done';
                const isActive = i === step && phase === 'analyzing';
                const isPending = i > step && phase === 'analyzing';
                return (
                  <div key={i} style={{padding:'10px 0',borderBottom:i<STEPS.length-1?'1px solid rgba(255,255,255,0.07)':'none',opacity:isPending?0.35:1,transition:'opacity 0.4s'}}>
                    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:isActive?6:0}}>
                      <div style={{width:28,height:28,borderRadius:'50%',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,

                      </div>
                    </div>
                    {/* Progress bar for active step */}
                    {isActive && (
                      <div style={{marginLeft:38,height:3,background:'rgba(255,255,255,0.1)',borderRadius:3,overflow:'hidden',marginTop:4}}>
                        <div style={{height:'100%',background:'var(--c-gold)',borderRadius:3,width:`${stepProgress}%`,transition:'width 0.03s linear'}}></div>

            </div>

            {/* Profile card reveal */}
            {revealedFields.length > 0 && (
              <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',background:'var(--c-cream)',borderRadius:8,border:'1px solid var(--c-gold-light)',marginBottom:14,animation:'revealField 0.4s ease'}}>

                  <div style={{fontSize:12,color:'var(--c-gray)'}}>{profile.title}</div>
                </div>
              </div>
            )}

            {/* Fields revealed one by one */}
            <div style={{display:'flex',flexDirection:'column',gap:0,marginBottom:12}}>
              {profile.fields.map(([k,v],i) => revealedFields.includes(i) && (
                <div key={k} style={{display:'flex',gap:12,padding:'7px 0',borderBottom:'1px solid var(--c-silver)',animation:'revealField 0.3s ease both'}}>
                  <div style={{fontSize:10.5,color:'var(--c-gray)',fontWeight:700,width:105,flexShrink:0,textTransform:'uppercase',letterSpacing:'0.05em',paddingTop:1}}>{k}</div>
                  <div style={{fontSize:13,color:'var(--c-black)',fontWeight:600}}>{v}</div>
                </div>
              ))}
            </div>

            {/* Skills */}
            {revealedFields.length >= profile.fields.length && (
              <div style={{animation:'revealField 0.4s ease',marginBottom:14}}>
                <div style={{fontSize:10.5,fontWeight:700,color:'var(--c-gray)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>Compétences identifiées</div>
                <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>

                    <div style={{height:'100%',borderRadius:4,background:scoreColor,animation:'progressFill 1.2s ease-out forwards',width:`${profile.score}%`}}></div>
                  </div>
                </div>
                <div style={{fontSize:12,color:scoreColor,fontWeight:600}}>
                  {profile.score>=80?'→ Ajouté à la Présélection automatiquement':profile.score>=65?'→ Profil pertinent, à examiner':'→ Profil enregistré, non retenu automatiquement'}
                </div>
              </div>
            )}

            {phase === 'done' && (
              <div style={{display:'flex',gap:8,animation:'revealField 0.4s 0.3s ease both',opacity:0,animationFillMode:'forwards'}}>
                <button className="btn btn-primary" style={{flex:1,justifyContent:'center'}} onClick={()=>onNavigate('candidates')}>Voir dans Candidatures →</button>
                <button className="btn btn-outline btn-sm" onClick={reset}>Nouvel import</button>
              </div>
            )}
          </div>
        </div>
      )}

      {toast && <div className="toast"><span className="toast-icon">✓</span>{toast}</div>}
    </div>
  );
}

function TalentPoolPage({ pool }) {
  const [view, setView] = useState('cards'); // 'cards' | 'list'
  const [search, setSearch] = useState('');
  const [filterSkill, setFilterSkill] = useState('');
  const [filterSource, setFilterSource] = useState('all');
  const [filterScore, setFilterScore] = useState('all');
  const [selected, setSelected] = useState(null);
  const [contact, setContact] = useState(null);
  const [poolPage, setPoolPage] = useState(1);
  const PER = 6;

  // All unique skills across pool
  const allSkills = [...new Set(pool.flatMap(c => c.skills || []))].sort();

  const filtered = pool.filter(c => {
    if (search && !c.name.toLowerCase().includes(search.toLowerCase()) && !(c.title||'').toLowerCase().includes(search.toLowerCase())) return false;
    if (filterSkill && !(c.skills||[]).includes(filterSkill)) return false;
    if (filterSource !== 'all' && c.sourceType !== filterSource) return false;
    if (filterScore === 'high' && c.score < 80) return false;
    if (filterScore === 'med' && (c.score < 60 || c.score >= 80)) return false;
    if (filterScore === 'low' && c.score >= 60) return false;
    return true;
  });

  const totalPages = Math.ceil(filtered.length / PER);
  const paginated = filtered.slice((poolPage-1)*PER, poolPage*PER);
  useEffect(() => setPoolPage(1), [search, filterSkill, filterSource, filterScore]);

  return (
    <div className="page fade-in" style={{background:'#F5F6FA'}}>

      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:18}}>

      {/* Filters */}

        <div style={{width:1,height:24,background:'var(--c-silver)',flexShrink:0}}></div>
        <select value={filterSkill} onChange={e=>setFilterSkill(e.target.value)}
          style={{flex:'1 1 140px',minWidth:0,padding:'6px 8px',border:'1.5px solid var(--c-silver)',borderRadius:7,fontSize:12.5,fontFamily:'inherit',color:'var(--c-black)',background:'white',outline:'none',cursor:'pointer'}}>
          <option value="">Toutes compétences</option>
          {allSkills.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <select value={filterSource} onChange={e=>setFilterSource(e.target.value)}
          style={{flex:'1 1 120px',minWidth:0,padding:'6px 8px',border:'1.5px solid var(--c-silver)',borderRadius:7,fontSize:12.5,fontFamily:'inherit',color:'var(--c-black)',background:'white',outline:'none',cursor:'pointer'}}>
          <option value="all">Toutes sources</option>
          <option value="li">LinkedIn</option>
          <option value="sc">Site carrière</option>
          <option value="jb">Novojob / Emploi.ci</option>
        </select>
        <select value={filterScore} onChange={e=>setFilterScore(e.target.value)}
          style={{flex:'1 1 120px',minWidth:0,padding:'6px 8px',border:'1.5px solid var(--c-silver)',borderRadius:7,fontSize:12.5,fontFamily:'inherit',color:'var(--c-black)',background:'white',outline:'none',cursor:'pointer'}}>
          <option value="all">Tous scores</option>
          <option value="high">Excellent (≥ 80)</option>
          <option value="med">Moyen (60–79)</option>
          <option value="low">Faible (&lt; 60)</option>
        </select>
        {(search||filterSkill||filterSource!=='all'||filterScore!=='all') && (
          <button className="btn btn-ghost btn-sm" style={{flexShrink:0,whiteSpace:'nowrap'}} onClick={()=>{setSearch('');setFilterSkill('');setFilterSource('all');setFilterScore('all');}}>
            ✕ Réinitialiser
          </button>
        )}
        <div style={{fontSize:12,color:'var(--c-gray)',flexShrink:0,whiteSpace:'nowrap',marginLeft:4}}><strong style={{color:'var(--c-navy)'}}>{filtered.length}</strong> résultat{filtered.length>1?'s':''}</div>
      </div>

      {/* CARD VIEW */}
      {view === 'cards' && (
        <>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:16}}>
            {paginated.map((c,i) => (
              <div key={c.id} onClick={()=>setSelected(c)}
                style={{background:'white',borderRadius:12,border:'1.5px solid #eee',padding:'18px',cursor:'pointer',transition:'all 0.2s',animationDelay:`${i*0.05}s`,position:'relative',overflow:'hidden'}}

                onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-3px)';e.currentTarget.style.boxShadow='0 8px 24px rgba(0,0,0,0.1)';e.currentTarget.style.borderColor='var(--c-navy)';}}

                    <div style={{fontSize:11.5,color:'var(--c-gray)',marginTop:1}}>{c.title}</div>
                  </div>

                <div style={{fontSize:12,color:'var(--c-gray)',marginBottom:10,display:'flex',gap:8}}>

                  <span>· {c.experience} ans</span>
                </div>
                <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:12}}>
                  {(c.skills||[]).slice(0,3).map(s=><span key={s} className="tag" style={{fontSize:10.5}}>{s}</span>)}
                  {(c.skills||[]).length > 3 && <span style={{fontSize:10.5,color:'var(--c-gray)',padding:'2px 6px'}}>+{(c.skills||[]).length-3}</span>}
                </div>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <SourceBadge type={c.sourceType} />

                </div>
              </div>
            ))}
          </div>

          {/* Pagination cards */}
          {totalPages > 1 && (
            <div style={{display:'flex',justifyContent:'center',alignItems:'center',gap:6}}>
              <button className="btn btn-outline btn-sm" onClick={()=>setPoolPage(p=>Math.max(1,p-1))} disabled={poolPage===1} style={{opacity:poolPage===1?0.4:1}}>←</button>
              {Array.from({length:totalPages},(_,i)=>i+1).map(n=>(
                <button key={n} className="btn btn-sm" onClick={()=>setPoolPage(n)} style={{minWidth:32,background:n===poolPage?'var(--c-navy)':'white',color:n===poolPage?'white':'var(--c-gray)',border:n===poolPage?'none':'1.5px solid var(--c-silver)'}}>{n}</button>
              ))}
              <button className="btn btn-outline btn-sm" onClick={()=>setPoolPage(p=>Math.min(totalPages,p+1))} disabled={poolPage===totalPages} style={{opacity:poolPage===totalPages?0.4:1}}>→</button>
            </div>
          )}
        </>
      )}

      {/* LIST VIEW */}
      {view === 'list' && (
        <div style={{background:'white',borderRadius:12,border:'1px solid #eee',overflow:'hidden',boxShadow:'0 1px 4px rgba(0,0,0,0.04)'}}>
          <div style={{display:'grid',gridTemplateColumns:'2fr 1.4fr 0.8fr 0.8fr 80px 110px',borderBottom:'2px solid var(--c-silver)'}}>
            {['Talent','Poste','Source','Score','Exp.','Action'].map(h=>(

            ))}
          </div>
          {paginated.map((c,i)=>(
            <div key={c.id} style={{display:'grid',gridTemplateColumns:'2fr 1.4fr 0.8fr 0.8fr 80px 110px',borderBottom:'1px solid var(--c-silver)',cursor:'pointer',transition:'background 0.12s',animationDelay:`${i*0.04}s'`}}
              className="fade-in"
              onMouseEnter={e=>e.currentTarget.style.background='#f8f9fb'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}
              onClick={()=>setSelected(c)}>
              <div style={{padding:'12px 14px',display:'flex',alignItems:'center',gap:10}}>
                <div className="avatar" style={{background:c.color,width:32,height:32,fontSize:12}}>{c.initials}</div>

                  <div style={{fontWeight:700,fontSize:13.5,color:'var(--c-black)'}}>{c.name}</div>

              </div>

            </div>

            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 16px',borderTop:'1px solid var(--c-silver)'}}>

                <button className="btn btn-outline btn-sm" onClick={()=>setPoolPage(p=>Math.max(1,p-1))} disabled={poolPage===1} style={{opacity:poolPage===1?0.4:1}}>←</button>
                {Array.from({length:totalPages},(_,i)=>i+1).map(n=>(
                  <button key={n} className="btn btn-sm" onClick={()=>setPoolPage(n)} style={{minWidth:32,background:n===poolPage?'var(--c-navy)':'white',color:n===poolPage?'white':'var(--c-gray)',border:n===poolPage?'none':'1.5px solid var(--c-silver)'}}>{n}</button>
                ))}
                <button className="btn btn-outline btn-sm" onClick={()=>setPoolPage(p=>Math.min(totalPages,p+1))} disabled={poolPage===totalPages} style={{opacity:poolPage===totalPages?0.4:1}}>→</button>
              </div>
            </div>
          )}
        </div>
      )}

      {selected && <TalentDetail cand={selected} onClose={()=>setSelected(null)} onContact={c=>{setSelected(null);setContact(c);}} />}
      {contact && <ContactModal cand={contact} onClose={()=>setContact(null)} />}
    </div>
  );
}

        {!showAllHistory && HISTORY.length > 5 && (

            <button className="btn btn-ghost btn-sm" onClick={() => setShowAllHistory(false)}>Réduire ↑</button>
          </div>
        )}
      </div>
    </div>
  );
}

    smLogo: <img src="uploads/AGL FINAL.png" alt="AGL" style={{width:12,height:12,objectFit:'contain'}} />,
  },
  { id:'edu', label:'Educarrière', color:'#1a6b3c',
    logo: <img src="uploads/logo.png" alt="Edu" style={{width:18,height:18,objectFit:'contain'}} />,
    smLogo: <img src="uploads/logo.png" alt="Edu" style={{width:12,height:12,objectFit:'contain'}} />,
  },
];


function OffresPage({ onNavigate, onOfferSelect }) {
  const [offres, setOffres] = React.useState(OFFRES_DATA);
  const [view, setView] = React.useState('list');
  const [statusFilter, setStatusFilter] = React.useState('active'); // active | draft | closed
  const [search, setSearch] = React.useState('');
  const [filterSector, setFilterSector] = React.useState('');
  const [filterContract, setFilterContract] = React.useState('');
  const [publishModal, setPublishModal] = React.useState(null);
  const [selectedChannels, setSelectedChannels] = React.useState([]);
  const [publishing, setPublishing] = React.useState(false);
  const [publishProgress, setPublishProgress] = React.useState(0);
  const [publishDone, setPublishDone] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const [form, setForm] = React.useState({ title:'', location:'', contract:'CDI', experience:'', sector:'', description:'', skills:'' });

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3500); };

  const allSectors = [...new Set(offres.map(o=>o.sector).filter(Boolean))];
  const allContracts = [...new Set(offres.map(o=>o.contract).filter(Boolean))];

  const filtered = offres.filter(o => {
    if (o.status !== statusFilter) return false;
    if (search && !o.title.toLowerCase().includes(search.toLowerCase()) && !o.location.toLowerCase().includes(search.toLowerCase())) return false;
    if (filterSector && o.sector !== filterSector) return false;
    if (filterContract && o.contract !== filterContract) return false;
    return true;
  });

  const counts = { active: offres.filter(o=>o.status==='active').length, draft: offres.filter(o=>o.status==='draft').length, closed: offres.filter(o=>o.status==='closed').length };

  const closeOffre = (id) => { setOffres(prev => prev.map(o => o.id===id ? {...o, status:'closed', published:[]} : o)); showToast('Offre clôturée et archivée.'); };
  const reactivateOffre = (id) => { setOffres(prev => prev.map(o => o.id===id ? {...o, status:'active'} : o)); showToast('Offre réactivée avec succès !'); };

  const openPublish = (o) => { setPublishModal(o); setSelectedChannels(o.published.length ? [...o.published] : []); setPublishDone(false); setPublishProgress(0); setPublishing(false); };

  const doPublish = () => {
    if (!selectedChannels.length) return;
    setPublishing(true); setPublishProgress(0);
    let prog = 0;
    const iv = setInterval(() => {
      prog += Math.random() * 15 + 8;
      setPublishProgress(Math.min(100, prog));
      if (prog >= 100) {
        clearInterval(iv);
        setOffres(prev => prev.map(o => o.id === publishModal.id ? {...o, published: selectedChannels, status:'active'} : o));
        setPublishDone(true); setPublishing(false);
      }
    }, 100);
  };

  const closePublish = () => {
    const wasDone = publishDone;
    setPublishModal(null); setPublishDone(false);
    if (wasDone) showToast('Offre publiée avec succès !');
  };

  const createOffre = () => {
    const o = { id: Date.now(), ...form, status:'draft', published:[], candidates:0, new:0, created: new Date().toLocaleDateString('fr-FR'), deadline:'31/05/2026', skills: form.skills.split(',').map(s=>s.trim()).filter(Boolean) };
    setOffres(prev => [...prev, o]);
    setForm({ title:'', location:'', contract:'CDI', experience:'', sector:'', description:'', skills:'' });
    setView('list'); setStatusFilter('draft'); showToast('Offre créée !');
  };

  if (view === 'create') return (
    <div className="page fade-in" style={{background:'#F5F6FA'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
        <button className="btn btn-ghost btn-sm" onClick={() => setView('list')}>← Retour</button>
        <div style={{fontWeight:800,fontSize:18,color:'var(--c-navy)'}}>Nouvelle offre</div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:16}}>
        <div style={{background:'white',borderRadius:12,padding:24,border:'1px solid #eee',boxShadow:'0 1px 4px rgba(0,0,0,0.04)',display:'flex',flexDirection:'column',gap:14}}>
          {[{label:'Intitulé du poste *',key:'title',ph:'Ex: Responsable Développement Commercial'},{label:'Localisation',key:'location',ph:"Ex: Abidjan · Hybride"},{label:'Secteur',key:'sector',ph:'Ex: Énergie / Logistique'},{label:'Expérience',key:'experience',ph:'Ex: 3–5 ans'}].map(f=>(
            <div key={f.key}>
              <label style={{fontSize:11.5,fontWeight:700,color:'var(--c-gray)',textTransform:'uppercase',letterSpacing:'0.06em',display:'block',marginBottom:5}}>{f.label}</label>
              <input type="text" placeholder={f.ph} value={form[f.key]} onChange={e=>setForm(p=>({...p,[f.key]:e.target.value}))} />
            </div>
          ))}
          <div>
            <label style={{fontSize:11.5,fontWeight:700,color:'var(--c-gray)',textTransform:'uppercase',letterSpacing:'0.06em',display:'block',marginBottom:5}}>Contrat</label>
            <select value={form.contract} onChange={e=>setForm(p=>({...p,contract:e.target.value}))} style={{width:'100%'}}>
              {['CDI','CDD','Stage','Alternance','Freelance'].map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label style={{fontSize:11.5,fontWeight:700,color:'var(--c-gray)',textTransform:'uppercase',letterSpacing:'0.06em',display:'block',marginBottom:5}}>Description</label>
            <textarea placeholder="Missions, contexte, responsabilités…" value={form.description} onChange={e=>setForm(p=>({...p,description:e.target.value}))} style={{minHeight:90}} />
          </div>
          <div>
            <label style={{fontSize:11.5,fontWeight:700,color:'var(--c-gray)',textTransform:'uppercase',letterSpacing:'0.06em',display:'block',marginBottom:5}}>Compétences <span style={{fontWeight:400,textTransform:'none'}}>(virgules)</span></label>
            <input type="text" placeholder="CRM, Négociation B2B, Management" value={form.skills} onChange={e=>setForm(p=>({...p,skills:e.target.value}))} />
          </div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div style={{background:'white',borderRadius:12,padding:20,border:'1px solid #eee',boxShadow:'0 1px 4px rgba(0,0,0,0.04)'}}>
            <div style={{fontWeight:800,fontSize:13,color:'var(--c-navy)',marginBottom:12}}>Canaux disponibles</div>
            <div style={{fontSize:12,color:'var(--c-gray)',marginBottom:10}}>Choisissez après création.</div>
            {PLATFORMS.map(p=>(
              <div key={p.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:8,border:'1.5px solid var(--c-silver)',marginBottom:8}}>
                <div style={{width:32,height:32,borderRadius:8,background:p.color,display:'flex',alignItems:'center',justifyContent:'center'}}>{p.logo}</div>
                <div style={{fontSize:12.5,fontWeight:600,color:'var(--c-black)'}}>{p.label}</div>
              </div>
            ))}
          </div>
          <button className="btn btn-gold" style={{justifyContent:'center',padding:14,fontSize:14}} onClick={createOffre} disabled={!form.title}>✓ Créer l'offre</button>
          <button className="btn btn-outline" style={{justifyContent:'center'}} onClick={()=>setView('list')}>Annuler</button>
        </div>
      </div>
      {toast && <div className="toast"><span className="toast-icon">✓</span>{toast}</div>}
    </div>
  );

  return (
    <div className="page fade-in" style={{background:'#F5F6FA'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <div style={{flex:1}}>
          <div style={{fontWeight:800,fontSize:18,color:'var(--c-navy)',letterSpacing:'-0.02em'}}>Offres de recrutement</div>
          <div style={{fontSize:12.5,color:'var(--c-gray)',marginTop:2}}>
            <strong style={{color:'var(--c-navy)'}}>{counts.active}</strong> actives · <strong style={{color:'var(--c-navy)'}}>{counts.draft}</strong> brouillon(s) · <strong style={{color:'var(--c-gray)'}}>{counts.closed}</strong> archivées
          </div>
        </div>
        <button className="btn btn-gold" onClick={()=>setView('create')}>＋ Nouvelle offre</button>
      </div>

      {/* Filter bar */}
      <div style={{background:'white',borderRadius:10,padding:'10px 16px',border:'1px solid #eee',marginBottom:14,display:'flex',gap:8,alignItems:'center',boxShadow:'0 1px 4px rgba(0,0,0,0.04)'}}>
        {/* Status tabs */}
        <div style={{display:'flex',gap:0,border:'1.5px solid var(--c-silver)',borderRadius:7,overflow:'hidden',flexShrink:0}}>
          {[{id:'active',label:`Actives (${counts.active})`},{id:'draft',label:`Brouillons (${counts.draft})`},{id:'closed',label:`Archivées (${counts.closed})`}].map(t=>(
            <div key={t.id} onClick={()=>setStatusFilter(t.id)}
              style={{padding:'6px 14px',fontSize:12,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',
                background:statusFilter===t.id?'var(--c-navy)':'white',
                color:statusFilter===t.id?'white':'var(--c-gray)',transition:'all 0.15s'}}>
              {t.label}
            </div>
          ))}
        </div>
        <div style={{width:1,height:24,background:'var(--c-silver)',flexShrink:0}}></div>
        <input type="text" placeholder="Rechercher une offre…" value={search} onChange={e=>setSearch(e.target.value)}
          style={{flex:'1 1 140px',minWidth:0,padding:'6px 10px',border:'1.5px solid var(--c-silver)',borderRadius:7,fontSize:12.5,fontFamily:'inherit',outline:'none'}} />
        <select value={filterSector} onChange={e=>setFilterSector(e.target.value)}
          style={{flex:'1 1 120px',minWidth:0,padding:'6px 8px',border:'1.5px solid var(--c-silver)',borderRadius:7,fontSize:12.5,fontFamily:'inherit',color:'var(--c-black)',background:'white',outline:'none',cursor:'pointer'}}>
          <option value="">Tous secteurs</option>
          {allSectors.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <select value={filterContract} onChange={e=>setFilterContract(e.target.value)}
          style={{flex:'1 1 100px',minWidth:0,padding:'6px 8px',border:'1.5px solid var(--c-silver)',borderRadius:7,fontSize:12.5,fontFamily:'inherit',color:'var(--c-black)',background:'white',outline:'none',cursor:'pointer'}}>
          <option value="">Tous contrats</option>
          {allContracts.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        {(search||filterSector||filterContract) && (
          <button className="btn btn-ghost btn-sm" style={{flexShrink:0,whiteSpace:'nowrap'}} onClick={()=>{setSearch('');setFilterSector('');setFilterContract('');}}>✕</button>
        )}
        <div style={{fontSize:12,color:'var(--c-gray)',flexShrink:0,whiteSpace:'nowrap',marginLeft:4}}>
          <strong style={{color:'var(--c-navy)'}}>{filtered.length}</strong> résultat{filtered.length>1?'s':''}
        </div>
      </div>

      {/* Offer list */}
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        {filtered.length === 0 && (
          <div style={{textAlign:'center',padding:'48px 20px',color:'var(--c-gray)',background:'white',borderRadius:12,border:'1px solid #eee'}}>
            <div style={{fontSize:32,marginBottom:8}}>📋</div>
            <div style={{fontWeight:600,fontSize:14}}>Aucune offre dans cette catégorie</div>
          </div>
        )}
        {filtered.map(o => (
          <div key={o.id} style={{background:'white',borderRadius:12,border:`1.5px solid ${o.status==='closed'?'#ddd':o.status==='draft'?'#e8d8b0':'#eee'}`,boxShadow:'0 1px 4px rgba(0,0,0,0.04)',overflow:'hidden',opacity:o.status==='closed'?0.75:1,transition:'opacity 0.2s'}}>
            <div style={{padding:'16px 22px',display:'flex',alignItems:'center',gap:16}}>
              <div style={{flex:1}}>
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:5}}>
                  <div style={{fontWeight:800,fontSize:15,color:o.status==='closed'?'var(--c-gray)':'var(--c-navy)'}}>{o.title}</div>
                  <span style={{fontSize:11,fontWeight:700,padding:'2px 9px',borderRadius:20,
                    background:o.status==='active'?'#e6f6ef':o.status==='draft'?'#fff8e6':'#f0f0f0',
                    color:o.status==='active'?'#1a7a42':o.status==='draft'?'#a06010':'var(--c-gray)'}}>
                    {o.status==='active'?'● Active':o.status==='draft'?'◎ Brouillon':'✕ Archivée'}
                  </span>
                </div>
                <div style={{display:'flex',gap:12,fontSize:12,color:'var(--c-gray)',flexWrap:'wrap'}}>
                  <span>📍 {o.location}</span><span>📋 {o.contract} · {o.experience}</span><span>🏭 {o.sector}</span><span>📅 {o.created}</span>
                </div>
              </div>
              <div style={{display:'flex',gap:16,flexShrink:0}}>
                {o.candidates > 0 && <div style={{textAlign:'center'}}>
                  <div style={{fontSize:26,fontWeight:900,color:'var(--c-navy)',lineHeight:1}}>{o.candidates}</div>
                  <div style={{fontSize:10,color:'var(--c-gray)',fontWeight:700,textTransform:'uppercase',marginTop:2}}>Candidats</div>
                </div>}
                {o.new > 0 && <div style={{textAlign:'center'}}>
                  <div style={{fontSize:26,fontWeight:900,color:'#1a7a42',lineHeight:1}}>{o.new}</div>
                  <div style={{fontSize:10,color:'#1a7a42',fontWeight:700,textTransform:'uppercase',marginTop:2}}>Nouveaux</div>
                </div>}
              </div>
              <div style={{display:'flex',gap:8,flexShrink:0}}>
                {o.status === 'closed' ? (
                  <button className="btn btn-outline btn-sm" style={{color:'#1a7a42',borderColor:'#b8e8cc'}} onClick={()=>reactivateOffre(o.id)}>↺ Réactiver</button>
                ) : (
                  <>
                    {o.candidates > 0 && <button className="btn btn-primary btn-sm" onClick={()=>{onOfferSelect(o);onNavigate('candidates');}}>Voir candidats →</button>}
                    {o.status !== 'closed' && <button className="btn btn-gold btn-sm" onClick={()=>openPublish(o)}>📡 Publier</button>}
                    <button className="btn btn-ghost btn-sm" style={{color:'#b03030',fontSize:11}} onClick={()=>closeOffre(o.id)}>Clôturer</button>
                  </>
                )}
              </div>
            </div>
            {o.published.length > 0 && o.status !== 'closed' && (
              <div style={{padding:'8px 22px',background:'#F5F6FA',borderTop:'1px solid #eee',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                <div style={{fontSize:11,color:'var(--c-gray)',fontWeight:700}}>Publié sur :</div>
                {o.published.map(pid=>{const p=PLATFORMS.find(x=>x.id===pid);return p?<div key={pid} style={{display:'flex',alignItems:'center',gap:5,padding:'3px 10px',borderRadius:20,background:p.color,fontSize:11.5,fontWeight:700,color:'white'}}><div style={{width:14,height:14,display:'flex',alignItems:'center',justifyContent:'center'}}>{p.smLogo}</div>{p.label}</div>:null;})}
                <div style={{flex:1}}></div>
                {(o.skills||[]).slice(0,3).map(s=><span key={s} className="tag" style={{fontSize:10.5}}>{s}</span>)}
              </div>
            )}
          </div>
        ))}
      </div>

      {/* Publish Modal */}
      {publishModal && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:500}} onClick={!publishing?closePublish:undefined}>
          <div className="card fade-in" style={{width:480,borderRadius:14,boxShadow:'0 16px 48px rgba(0,0,0,0.2)',padding:28}} onClick={e=>e.stopPropagation()}>
            {!publishDone ? (
              <>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                  <div style={{fontWeight:800,fontSize:16,color:'var(--c-navy)'}}>Choisir les canaux</div>
                  {!publishing && <button className="btn btn-ghost btn-sm" onClick={closePublish}>✕</button>}
                </div>
                <div style={{fontSize:12.5,color:'var(--c-gray)',marginBottom:18}}>{publishModal.title}</div>
                <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:20}}>
                  {PLATFORMS.map(p=>{const checked=selectedChannels.includes(p.id);return(
                    <div key={p.id} onClick={()=>!publishing&&setSelectedChannels(prev=>checked?prev.filter(x=>x!==p.id):[...prev,p.id])}
                      style={{display:'flex',alignItems:'center',gap:14,padding:'14px 16px',borderRadius:10,border:`2px solid ${checked?p.color:'var(--c-silver)'}`,background:checked?p.color+'18':'white',cursor:publishing?'default':'pointer',transition:'all 0.2s'}}>
                      <div style={{width:40,height:40,borderRadius:10,background:p.color,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{p.logo}</div>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:700,fontSize:14,color:'var(--c-black)'}}>{p.label}</div>
                        <div style={{fontSize:11.5,color:'var(--c-gray)',marginTop:2}}>{p.id==='li'?'API LinkedIn Talent Solutions':p.id==='sc'?'Webhook site carrière AGL':'Portail Educarrière.ci'}</div>
                      </div>
                      <div style={{width:22,height:22,borderRadius:'50%',border:`2.5px solid ${checked?p.color:'var(--c-silver)'}`,background:checked?p.color:'white',display:'flex',alignItems:'center',justifyContent:'center',transition:'all 0.2s',flexShrink:0}}>
                        {checked&&<span style={{color:'white',fontSize:12,fontWeight:700}}>✓</span>}
                      </div>
                    </div>
                  );})}
                </div>
                {publishing && (
                  <div style={{marginBottom:16}}>
                    <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--c-gray)',marginBottom:6}}><span>Publication en cours…</span><span>{Math.round(publishProgress)}%</span></div>
                    <div style={{height:8,background:'var(--c-silver)',borderRadius:4,overflow:'hidden'}}>
                      <div style={{height:'100%',background:'var(--c-navy)',borderRadius:4,width:`${publishProgress}%`,transition:'width 0.1s'}}></div>
                    </div>
                  </div>
                )}
                <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
                  {!publishing&&<button className="btn btn-outline" onClick={closePublish}>Annuler</button>}
                  <button className="btn btn-gold" disabled={!selectedChannels.length||publishing} onClick={doPublish} style={{opacity:!selectedChannels.length||publishing?0.5:1}}>
                    {publishing?'Publication…':`Publier sur ${selectedChannels.length} canal${selectedChannels.length>1?'x':''}`}
                  </button>
                </div>
              </>
            ) : (
              <div style={{textAlign:'center',padding:'20px 0'}}>
                <div style={{fontSize:48,marginBottom:12}}>🎉</div>
                <div style={{fontWeight:800,fontSize:18,color:'var(--c-navy)',marginBottom:8}}>Offre publiée !</div>
                <div style={{fontSize:13,color:'var(--c-gray)',marginBottom:16}}><strong>{publishModal.title}</strong> est visible sur :</div>
                <div style={{display:'flex',gap:8,justifyContent:'center',marginBottom:20}}>
                  {selectedChannels.map(pid=>{const p=PLATFORMS.find(x=>x.id===pid);return p?<div key={pid} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',borderRadius:20,background:p.color,color:'white',fontSize:13,fontWeight:700}}><div style={{width:16,height:16,display:'flex',alignItems:'center',justifyContent:'center'}}>{p.smLogo}</div>{p.label}</div>:null;})}
                </div>
                <button className="btn btn-primary" onClick={closePublish} style={{width:'100%',justifyContent:'center'}}>Fermer</button>
              </div>
            )}
          </div>
        </div>
      )}
      {toast && <div className="toast"><span className="toast-icon">✓</span>{toast}</div>}
    </div>
  );
}

  candidates: 'Candidatures',

  pool: 'Base de talents',
  responses: 'Réponses automatiques',
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#fe9239",
  "sidebarDark": true,
  "showScores": true,
  "jobTitle": "Chef d'exploitation Terminal à Conteneurs"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const { TweaksPanel, TweakColor, TweakToggle, TweakSection, TweakText } = window;
  const [page, setPage] = useState('dashboard');
  const [user, setUser] = useState(null);
  const [talentPool, setTalentPool] = useState([
    { id:101, name:'Kofi Asante', initials:'KA', color:'#a06010', score:78, title:'Superviseur terminal à conteneurs', experience:6, location:'Tema, Ghana', skills:['Gestion portuaire','Grutage','SAP'], sourceType:'jb' },
    { id:102, name:'Fatoumata Sy', initials:'FS', color:'#5a3e8c', score:74, title:'Coordinatrice transit maritime', experience:5, location:'Dakar, Sénégal', skills:['Transit','Douanes','OHADA'], sourceType:'li' },
    { id:103, name:'Amadou Diop', initials:'AD', color:'#2a5d8c', score:81, title:'Chef d\'exploitation logistique', experience:8, location:'Abidjan, Côte d\'Ivoire', skills:['Supply chain','TMS','Management'], sourceType:'sc' },
    { id:104, name:'Grace Okafor', initials:'GO', color:'#1a7a42', score:69, title:'Responsable dédouanement', experience:4, location:'Lagos, Nigeria', skills:['Customs','Import/Export','Freight'], sourceType:'li' },
    { id:105, name:'Cheikh Ndiaye', initials:'CN', color:'#143C64', score:72, title:'Ingénieur logistique portuaire', experience:7, location:'Conakry, Guinée', skills:['Manutention','Planification','ISO 9001'], sourceType:'jb' },
  ]);

  const [candidates, setCandidates] = useState(CANDIDATES);
  const [activeOffer, setActiveOffer] = useState(null);
  const addCandidate = (cand) => setCandidates(prev => prev.find(c => c.id === cand.id) ? prev : [...prev, cand]);

  const addToPool = (cand) => {
    setTalentPool(pool => pool.find(c => c.id === cand.id) ? pool : [...pool, cand]);
  };

  if (!user) return <LoginPage onLogin={setUser} />;

  return (
    <div className="app">
      <aside className="sidebar" style={{background: tweaks.sidebarDark ? 'var(--c-navy)' : '#1c2d40'}}>
        <div className="sidebar-logo" style={{textAlign:'center'}}>
          <img src="uploads/AGL FINAL.png" alt="AGL" style={{width:'160px',marginBottom:8}} />
          <div className="logo-sub" style={{marginTop:4}}>Traitement intelligent des candidatures</div>
        </div>

        <nav className="sidebar-nav">
          <div className="nav-section-label">Navigation</div>
          {NAV.map(n => (
            <div key={n.id} className={`nav-item ${page===n.id?'active':''}`}
              onClick={() => setPage(n.id)}>
              {n.icon}
              {n.label}
              {n.badge && tweaks.showScores && <span className="nav-badge">{n.badge}</span>}
            </div>
          ))}
        </nav>

        <div className="sidebar-job">
          <div className="job-label">Offre active</div>
          <div className="job-title">{tweaks.jobTitle}</div>
          <div className="job-meta">Abidjan · CDI · 5–8 ans exp.</div>
        </div>
      </aside>

      <div className="main">
        <header className="topbar">
          <div style={{flex:1}}>
            <div className="topbar-title">{PAGE_TITLES[page]}</div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <UserMenu user={user} onLogout={() => setUser(null)} />
          </div>
        </header>

        {page === 'offres' && <OffresPage onNavigate={setPage} onOfferSelect={setActiveOffer} />}
        {page === 'dashboard' && <Dashboard onNavigate={setPage} />}
        {page === 'candidates' && <CandidatesPage candidates={candidates} tweaks={tweaks} addToPool={addToPool} talentPool={talentPool} activeOffer={activeOffer} onClearOffer={() => setActiveOffer(null)} />}
        {page === 'ingestion' && <IngestionPage onNavigate={setPage} onCandidateImported={addCandidate} />}
        {page === 'linkedin' && <IntegrationsPage />}
        {page === 'pool' && <TalentPoolPage pool={talentPool} />}
        {page === 'responses' && <ResponsesPage />}
      </div>

      <TweaksPanel>
        <TweakSection label="Apparence">
          <TweakColor id="accentColor" label="Couleur d'accent" value={tweaks.accentColor} onChange={v => { setTweak('accentColor', v); document.documentElement.style.setProperty('--c-gold', v); }} />
          <TweakToggle id="sidebarDark" label="Sidebar sombre" value={tweaks.sidebarDark} onChange={v => setTweak('sidebarDark', v)} />
          <TweakToggle id="showScores" label="Afficher les compteurs" value={tweaks.showScores} onChange={v => setTweak('showScores', v)} />
        </TweakSection>
        <TweakSection label="Contenu">
          <TweakText id="jobTitle" label="Intitulé du poste" value={tweaks.jobTitle} onChange={v => setTweak('jobTitle', v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
